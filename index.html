<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffc129">
  <meta name="description" content="Alat visual interaktif untuk memahami pecahan Matematik Tahun 3.">
  <title>Smart Fraction Visual Tool - Math Year 3</title>
  <link rel="icon" type="image/png" href="edcloud-app-icon.png">
  <link rel="preload" href="assets/ui-icons/sound-off.png" as="image" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="auth-gate" id="authGate" role="status" aria-live="polite" aria-atomic="true" aria-labelledby="authTitle">
    <div class="auth-card">
      <span class="auth-indicator" aria-hidden="true"></span>
      <h1 id="authTitle">Connecting to EdCloud…</h1>
      <p id="authMessage">Please wait while your secure tool session is verified.</p>
    </div>
  </section>

  <div class="page-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="edcloud-app-icon.png" alt="" aria-hidden="true" draggable="false">
        <div>
          <h1 data-i18n="appTitle">Jom Teroka Pecahan!</h1>
          <p data-i18n="appSubtitle">Lihat, sentuh dan fahami bahagiannya.</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="fullscreen-button" id="fullscreenToggle" type="button" aria-pressed="false">
          <span aria-hidden="true">⛶</span><span data-i18n="fullscreen">Skrin penuh</span>
        </button>
        <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">
          <img id="soundIcon" class="sound-icon" src="assets/ui-icons/sound-on.png" width="28" height="28" alt="" aria-hidden="true" draggable="false">
          <span data-i18n="soundOn">Bunyi</span>
        </button>
        <div class="language-switch" role="group" aria-label="Language">
          <button class="language-btn active" type="button" data-lang="bm" aria-pressed="true">BM</button>
          <button class="language-btn" type="button" data-lang="zh" aria-pressed="false">中文</button>
          <button class="language-btn" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main>
      <nav class="mode-tabs" id="modeTabs" aria-label="Learning modes">
        <button class="mode-tab" type="button" data-mode="pizza" aria-pressed="false">
          <img class="mode-icon" src="assets/activity-icons/pizza.png" width="58" height="58" alt="" aria-hidden="true" draggable="false"><span data-i18n="modePizza">Sebahagian daripada Satu Keseluruhan</span>
        </button>
        <button class="mode-tab active" type="button" data-mode="set" aria-pressed="true">
          <img class="mode-icon" src="assets/activity-icons/set.png" width="58" height="58" alt="" aria-hidden="true" draggable="false"><span data-i18n="modeSet">Bahagian Kumpulan</span>
        </button>
        <button class="mode-tab" type="button" data-mode="equivalent" aria-pressed="false">
          <img class="mode-icon" src="assets/activity-icons/equivalent.png" width="58" height="58" alt="" aria-hidden="true" draggable="false"><span data-i18n="modeEquivalent">Pecahan Setara</span>
        </button>
        <button class="mode-tab" type="button" data-mode="mixed" aria-pressed="false">
          <img class="mode-icon" src="assets/activity-icons/mixed.png" width="58" height="58" alt="" aria-hidden="true" draggable="false"><span data-i18n="modeMixed">Tak Wajar &amp; Bercampur</span>
        </button>
        <button class="mode-tab" type="button" data-mode="hundred" aria-pressed="false">
          <img class="mode-icon" src="assets/activity-icons/hundred.png" width="58" height="58" alt="" aria-hidden="true" draggable="false"><span data-i18n="modeHundred">Grid Seratus</span>
        </button>
      </nav>

      <section class="workspace">
        <section class="visual-panel" aria-labelledby="promptText">
          <div class="prompt-row">
            <div>
              <span class="eyebrow" data-i18n="yourTask">Mari cuba!</span>
              <h2 id="promptText">Tunjukkan pecahan daripada kumpulan ini.</h2>
            </div>
            <div class="heading-actions">
              <span class="level-badge" id="levelBadge">Matematik Tahun 3</span>
              <button class="secondary-btn compact" id="teacherBtn" type="button">
                <span aria-hidden="true">👩‍🏫</span><span data-i18n="teacherQuestion">Guru buat soalan</span>
              </button>
              <button class="primary-btn compact" id="newQuestionBtn" type="button">
                <span aria-hidden="true">🎲</span><span data-i18n="newQuestion">Cuba soalan lain</span>
              </button>
            </div>
          </div>

          <div class="challenge-display" id="challengeDisplay" aria-live="polite"></div>
          <div class="concept-stage" id="conceptStage" tabindex="-1"></div>

          <div class="answer-actions">
            <button class="secondary-btn" id="resetBtn" type="button">
              <span aria-hidden="true">↺</span><span data-i18n="reset">Mula semula</span>
            </button>
            <button class="primary-btn" id="checkBtn" type="button">
              <span aria-hidden="true">✓</span><span data-i18n="check">Semak</span>
            </button>
          </div>

          <div class="feedback" id="feedback" aria-live="polite"></div>
        </section>
      </section>
    </main>
  </div>

  <dialog class="teacher-dialog" id="teacherDialog" aria-labelledby="teacherDialogTitle">
    <form class="teacher-form" id="teacherForm" novalidate>
      <div class="teacher-dialog-header">
        <div>
          <span class="eyebrow" data-i18n="teacherMode">Mod guru</span>
          <h2 id="teacherDialogTitle" data-i18n="teacherTitle">Bina soalan sendiri</h2>
        </div>
        <button class="dialog-close" id="teacherCloseBtn" type="button" aria-label="Close">×</button>
      </div>
      <p class="teacher-intro" data-i18n="teacherIntro">Tetapkan nombor untuk aktiviti ini.</p>
      <div class="teacher-fields" id="teacherFields"></div>
      <div class="teacher-error" id="teacherError" role="alert"></div>
      <div class="teacher-dialog-actions">
        <button class="secondary-btn" id="teacherCancelBtn" type="button" data-i18n="cancel">Batal</button>
        <button class="primary-btn" type="submit">
          <span aria-hidden="true">✓</span><span data-i18n="useQuestion">Gunakan soalan</span>
        </button>
      </div>
    </form>
  </dialog>

  <script src="grade-config.js"></script>
  <script type="module" src="auth-bootstrap.js"></script>
</body>
</html>
